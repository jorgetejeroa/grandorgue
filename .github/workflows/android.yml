name: APK Órgano Praeludium

on:
  push:
    branches: [app-praeludium]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar el APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk "OrganoPraeludium-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OrganoPraeludium-apk
          path: OrganoPraeludium-*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "praeludium-0.1.${{ github.run_number }}" \
            "OrganoPraeludium-0.1.${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Órgano Praeludium 0.1.${{ github.run_number }}" \
            --notes "App para la tablet. Descarga el archivo .apk desde la tablet e instálalo (encima de la versión anterior, sin desinstalar)."
