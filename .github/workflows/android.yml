name: APK Órgano Praeludium

on:
  push:
    branches: [app-praeludium]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Comprobar el SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar el APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Publicar los errores de compilación
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { grep -E "^e: |error:|What went wrong|FAILURE|Exception" build.log | head -150; echo; echo '--- final ---'; tail -60 build.log; } > errores.txt || true
          gh release create "errores-${{ github.run_number }}" --prerelease --target "${{ github.sha }}" \
            --title "Errores de compilación ${{ github.run_number }}" --notes-file errores.txt || true

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk "OrganoPraeludium-0.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OrganoPraeludium-apk
          path: OrganoPraeludium-*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "praeludium-0.2.${{ github.run_number }}" \
            "OrganoPraeludium-0.2.${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Órgano Praeludium 0.2.${{ github.run_number }}" \
            --notes "App para la tablet. Descarga el archivo .apk desde la tablet e instálalo (encima de la versión anterior, sin desinstalar)."
